[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "interval-tree"
version = "1.0.0"
description = "Augmented BST for fast interval overlap and stabbing queries"
requires-python = ">=3.9"

[project.scripts]
interval-tree = "interval_tree.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
